name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      # Nothing ships in the VSIX but src/ and assets/ — `dependencies` is empty —
      # so this is the only audit that can reach a user, and it stays blocking. It
      # starts guarding for real the day a runtime dependency is added.
      - run: npm audit --omit=dev --audit-level=high
      # The dev tree is @vscode/vsce and ~240 transitive packages, none of them
      # bundled. An advisory in a packaging tool is worth seeing, not worth a red
      # main that blocks shipping a fix for something else.
      - run: npm audit --audit-level=high
        continue-on-error: true
      - run: npm run check
      - run: npm test
      - name: Verify VSIX packaging
        if: matrix.node-version == 22
        run: npm run package -- --out codex-hud-test.vsix
