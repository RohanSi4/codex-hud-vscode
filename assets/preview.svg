<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title description">
  <title id="title">Codex HUD preview</title>
  <desc id="description">A VS Code window with context and seven-day usage bars in the status bar.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity="0.42"/>
    </filter>
  </defs>
  <rect width="1200" height="500" rx="28" fill="url(#background)"/>
  <text x="72" y="92" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="42" font-weight="700">Codex HUD</text>
  <text x="72" y="132" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="20">Live context and quota visibility, directly in VS Code.</text>
  <g filter="url(#shadow)">
    <rect x="72" y="180" width="1056" height="230" rx="16" fill="#18181b" stroke="#334155"/>
    <rect x="72" y="180" width="1056" height="42" rx="16" fill="#27272a"/>
    <rect x="72" y="205" width="1056" height="17" fill="#27272a"/>
    <circle cx="98" cy="201" r="7" fill="#fb7185"/>
    <circle cx="121" cy="201" r="7" fill="#fbbf24"/>
    <circle cx="144" cy="201" r="7" fill="#4ade80"/>
    <text x="600" y="207" text-anchor="middle" fill="#a1a1aa" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14">jobAutomation — Visual Studio Code</text>
    <text x="110" y="272" fill="#c084fc" font-family="SFMono-Regular,Consolas,monospace" font-size="18">const</text>
    <text x="172" y="272" fill="#e4e4e7" font-family="SFMono-Regular,Consolas,monospace" font-size="18">ship = </text>
    <text x="245" y="272" fill="#86efac" font-family="SFMono-Regular,Consolas,monospace" font-size="18">"with context"</text>
    <text x="400" y="272" fill="#e4e4e7" font-family="SFMono-Regular,Consolas,monospace" font-size="18">;</text>
    <rect x="72" y="368" width="1056" height="42" rx="0" fill="#18181b"/>
    <line x1="72" y1="368" x2="1128" y2="368" stroke="#3f3f46"/>
    <text x="714" y="395" fill="#4ade80" font-family="SFMono-Regular,Consolas,monospace" font-size="15">Ctx</text>
    <rect x="750" y="384" width="108" height="10" rx="5" fill="#3f3f46"/>
    <rect x="750" y="384" width="59" height="10" rx="5" fill="#4ade80"/>
    <text x="868" y="395" fill="#4ade80" font-family="SFMono-Regular,Consolas,monospace" font-size="15">55%</text>
    <text x="929" y="395" fill="#4ade80" font-family="SFMono-Regular,Consolas,monospace" font-size="15">7d</text>
    <rect x="954" y="384" width="108" height="10" rx="5" fill="#3f3f46"/>
    <rect x="954" y="384" width="33" height="10" rx="5" fill="#4ade80"/>
    <text x="1072" y="395" fill="#4ade80" font-family="SFMono-Regular,Consolas,monospace" font-size="15">31%</text>
  </g>
  <text x="72" y="462" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16">Local-first · Zero dependencies · Native Codex telemetry</text>
</svg>
